services:
  esp-nas-status:
    image: hanfu1997/esp_nas_status:${IMAGE_TAG:-latest}
    container_name: esp-nas-status
    restart: unless-stopped
    network_mode: host
    environment:
      TOKEN: "${TOKEN:-changeme}"
      HOST: "0.0.0.0"
      PORT: "${PORT:-8099}"
      DISK_PATH: "${DISK_PATH:-/}"
      EVENT_STORE_PATH: "/data/latest_event.json"
      UGREEN_NAS_PASSWORD: "${UGREEN_NAS_PASSWORD:-}"
      BRIDGE_CONFIG: "/app/bridge_config.json"
    volumes:
      - ./data:/data
      - ./data:/app/data
      - ./bridge_config.json:/app/bridge_config.json:ro
      - /:/host_root:ro
