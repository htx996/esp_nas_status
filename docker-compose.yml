services:
  esp-nas-status:
    image: hanfu1997/esp_nas_status:${IMAGE_TAG:-latest}
    container_name: esp-nas-status
    restart: unless-stopped
    network_mode: host
    environment:
      TOKEN: "${TOKEN:-changeme}"
      HOST: "0.0.0.0"
      PORT: "${PORT:-8099}"
      DISK_PATH: "${DISK_PATH:-/}"
      EVENT_STORE_PATH: "/data/latest_event.json"
      UGREEN_NAS_USERNAME: "${UGREEN_NAS_USERNAME:-}"
      UGREEN_NAS_PASSWORD: "${UGREEN_NAS_PASSWORD:-}"
      UGREEN_POLL_INTERVAL_SEC: "${UGREEN_POLL_INTERVAL_SEC:-10}"
      UGREEN_ALLOW_APPS: "${UGREEN_ALLOW_APPS:-}"
    volumes:
      - ./data:/data
      - ./data:/app/data
      - /:/host_root:ro
